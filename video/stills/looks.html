<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600&family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
  html,body{margin:0;background:#070b0b;}
  #f{position:relative;width:1920px;height:1080px;overflow:hidden;background:#070b0b;color:#e9f2ef;font-family:'Instrument Sans',sans-serif}
  canvas{position:absolute;inset:0}
  .title{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center}
  .name{font-weight:600;font-size:220px;letter-spacing:-0.045em;line-height:1}
  .tag{font-size:46px;color:#a5b6b1;margin-top:28px;letter-spacing:-0.01em}
  .tag i{font-family:'Instrument Serif',serif;color:#6fe3c1;font-size:56px}
  .mark{display:inline-block;vertical-align:middle;margin-right:34px;transform:translateY(-14px)}
  .label{position:absolute;left:56px;bottom:44px;font:500 22px 'JetBrains Mono',monospace;color:#6f827c;letter-spacing:.06em}
  .glass{position:absolute;inset:0;backdrop-filter:blur(38px) saturate(120%);-webkit-backdrop-filter:blur(38px) saturate(120%);background:rgba(10,18,17,.35)}
  .lens{position:absolute;left:50%;top:50%;width:1000px;height:640px;transform:translate(-50%,-50%);}
</style></head>
<body><div id="f">
<canvas id="c" width="1920" height="1080"></canvas>
<div id="glass" class="glass" hidden></div>
<div class="title">
  <div class="name"><svg class="mark" width="190" height="190" viewBox="0 0 32 32" fill="none"><defs><clipPath id="a"><circle cx="12" cy="16" r="9"/></clipPath></defs><circle cx="12" cy="16" r="9" stroke="#E9F2EF" stroke-width="1.4"/><circle cx="20" cy="16" r="9" stroke="#E9F2EF" stroke-width="1.4"/><circle cx="20" cy="16" r="9" fill="#6FE3C1" clip-path="url(#a)"/><circle cx="16" cy="16" r="1.5" fill="#04211A"/></svg>sublee</div>
  <div class="tag">A second opinion that stays <i>yours.</i></div>
</div>
<div class="label" id="lbl"></div>
</div>
<script>
const look = new URLSearchParams(location.search).get('look') || 'A';
const c = document.getElementById('c'), g = c.getContext('2d');
let s = 7; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
const W = 1920, H = 1080;
const words = 'fatigue for three months ferritin low TSH normal iron tablets since june short of breath on stairs mother had thyroid disease ibuprofen sometimes no known allergies heavy periods vitamin d 18 ng/ml hemoglobin 10.9 g/dL age 34 female worried'.split(' ');
// Quiet centre: fade detail toward the middle where the title sits.
const edge = (x, y) => Math.min(1, Math.hypot((x - W / 2) / (W * 0.42), (y - H / 2) / (H * 0.36)) ** 2);

if (look === 'A') { // Redaction: case notes that black themselves out
  document.getElementById('lbl').textContent = 'A · REDACTION — your case is written, then sealed bar by bar';
  g.font = '500 22px JetBrains Mono';
  for (let y = 40; y < H; y += 40) {
    let x = 30 + rnd() * 40;
    while (x < W) {
      const w = words[Math.floor(rnd() * words.length)], tw = g.measureText(w).width;
      const e = edge(x + tw / 2, y);
      const sealed = rnd() < 0.55;
      if (sealed) { g.fillStyle = `rgba(111,227,193,${0.05 + 0.16 * e})`; g.fillRect(x - 3, y - 18, tw + 6, 24); g.fillStyle = `rgba(4,33,26,${0.5 * e})`; g.fillRect(x - 3, y - 7, tw + 6, 2); }
      else { g.fillStyle = `rgba(165,182,177,${0.04 + 0.22 * e})`; g.fillText(w, x, y); }
      x += tw + 18;
    }
  }
} else if (look === 'B') { // Frosted glass: soft light behind fogged glass, the lens is clear
  document.getElementById('lbl').textContent = 'B · FROSTED GLASS — the world is fogged; only the lens is clear';
  const blobs = [[300, 260, 420, '111,227,193', .28], [1600, 820, 520, '111,227,193', .2], [1500, 200, 300, '165,182,177', .12], [380, 900, 360, '243,194,122', .08], [960, 540, 300, '111,227,193', .06]];
  for (const [x, y, r, col, a] of blobs) { const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, `rgba(${col},${a})`); gr.addColorStop(1, `rgba(${col},0)`); g.fillStyle = gr; g.fillRect(0, 0, W, H); }
  g.font = '500 30px JetBrains Mono';
  for (let i = 0; i < 70; i++) { g.fillStyle = `rgba(233,242,239,${0.1 + rnd() * 0.18})`; g.fillText(words[i % words.length], rnd() * W, rnd() * H); }
  document.getElementById('glass').hidden = false;
  // a faint etched grid on the glass
  const o = document.createElement('canvas'); o.width = W; o.height = H; o.style.cssText = 'position:absolute;inset:0'; const og = o.getContext('2d');
  og.strokeStyle = 'rgba(233,242,239,0.035)'; for (let x = 0; x < W; x += 64) { og.beginPath(); og.moveTo(x, 0); og.lineTo(x, H); og.stroke(); } for (let y = 0; y < H; y += 64) { og.beginPath(); og.moveTo(0, y); og.lineTo(W, y); og.stroke(); }
  document.getElementById('glass').after(o);
} else { // Ciphertext: a field of hex that resolves to words only inside the logo's lens
  document.getElementById('lbl').textContent = 'C · CIPHER FIELD — hex everywhere; words only where the two circles meet';
  g.font = '500 20px JetBrains Mono';
  const hex = '0123456789abcdef';
  const inLens = (x, y, cx, cy, r, d) => Math.hypot(x - (cx - d), y - cy) < r && Math.hypot(x - (cx + d), y - cy) < r;
  for (let y = 26; y < H; y += 30) for (let x = 14; x < W; x += 15) {
    const e = edge(x, y);
    const L = inLens(x, y, 1560, 760, 300, 120) || inLens(x, y, 330, 280, 240, 96);
    if (L) { g.fillStyle = `rgba(111,227,193,${0.55})`; }
    else g.fillStyle = `rgba(111,130,124,${0.05 + 0.3 * e * rnd()})`;
    g.fillText(L ? 'abcdefghijklmnopqrstuvwxyz'[Math.floor(rnd() * 26)] : hex[Math.floor(rnd() * 16)], x, y);
  }
  g.strokeStyle = 'rgba(233,242,239,0.25)'; g.lineWidth = 2;
  for (const [cx, cy, r, d] of [[1560, 760, 300, 120], [330, 280, 240, 96]]) for (const k of [-1, 1]) { g.beginPath(); g.arc(cx + k * d, cy, r, 0, Math.PI * 2); g.stroke(); }
}
</script>
</body></html>
